name: Build static satis page

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [satis]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DF_BOT_APP_ID }}
          private-key: ${{ secrets.DF_BOT_PRIVATE_KEY }}
          owner: cfc-to
          repositories: cfc-theme,chorus-php-client,electre-php-client,erp-php-client,hermes-php-client,site-php-client,yellowbox-php-client
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup and build satis
        env:
          AUTH_JSON: '{"github-oauth": {"github.com": "${{ steps.app-token.outputs.token }}"}}'
        run: |
          if [ ! -d composer ]; then mkdir composer; fi
          echo "$AUTH_JSON" > composer/auth.json
          docker run --rm -i -v ${{ github.workspace }}:/build -v ${{ github.workspace }}/composer:/composer -v ${{ github.workspace }}/.gitconfig:/root/.gitconfig composer/satis build satis.json output

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output
